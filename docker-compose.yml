services:
  shifaa:
    build: .
    image: shifaa-app:latest
    container_name: shifaa-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # ==== Supabase (required) ====
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # القيم أعلاه تُحقن أيضاً كـ VITE_* عند البناء عبر build args في Dockerfile إن رغبت
      # ==== Email (Resend) ====
      RESEND_API_KEY: ${RESEND_API_KEY}
      # ==== Optional ====
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
